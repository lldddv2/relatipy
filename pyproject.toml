[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "relatipy"
version = "0.4.0"
description = "Numeric and symbolic tools for Kerr black hole geometry"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "lldddv2"}]

dependencies = [
    "sympy",
    "numpy",
    "scipy",
    "plotly",
    "einsteinpy",
    "pytest>=9.0.2",
    "astropy>=6",
    "spiceypy>=8.0.2",
    "matplotlib>=3.10.8",
    "nbformat>=4.2.0",
    "pandas>=2.3.3",
]

[project.optional-dependencies]
dev = ["black", "flake8", "isort", "pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["src"]

# Ship C source in sdist; radau_core.so is produced at build time (see setup.py).
[tool.setuptools.package-data]
relatipy = ["numeric/geodesic/integrators/radau_core.c"]
