[build-system]
requires = ["setuptools>=75", "wheel", "Cython>=3", "numpy>=2"]
build-backend = "setuptools.build_meta"

[project]
name = "relatipy"
version = "1.1.1"
description = "Numerical tools for relativistic geometry"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "lldddv2" },
]
dependencies = [
    "numpy>=2",
    "astropy>=6",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "plotly>=5",
    "nbformat>=4.2",  # Plotly display in notebooks
]

[project.urls]
Homepage = "https://github.com/lldddv2/relatipy"
Documentation = "https://relatipy.readthedocs.io/en/latest/"
Source = "https://github.com/lldddv2/relatipy"
Issues = "https://github.com/lldddv2/relatipy/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "einsteinpy>=0.4.0",
]
notebook = [
    "pandas>=2",
    "ipykernel>=6",
    "nbclient>=0.10",
    "emcee>=3.1,<4",
]
docs = [
    "sphinx>=8.2,<9",
    "sphinx-rtd-theme>=3.0,<4",
    "sphinx-reredirects>=1.0,<2",
    "myst-nb>=1.2,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
