[build-system]
requires = ["setuptools>=75", "wheel", "Cython>=3", "numpy>=2"]
build-backend = "setuptools.build_meta"

[project]
name = "relatipy"
version = "1.1.0"
description = "Numerical tools for relativistic geometry"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "lldddv2" },
]
dependencies = ["numpy>=2", "astropy>=6", "scipy>=1.11"]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
interactive = ["plotly>=5", "nbformat>=4.2"]  # nbformat: Plotly display in notebooks
mcmc = ["emcee>=3.1,<4"]
notebook = ["matplotlib>=3.8", "plotly>=5", "pandas>=2", "ipykernel>=6", "nbformat>=5", "nbclient>=0.10", "emcee>=3.1,<4"]

[dependency-groups]
dev = [
    "pytest>=8",
    "einsteinpy>=0.4.0",
]
docs = [
    "sphinx>=8.2,<9",
    "sphinx-rtd-theme>=3.0,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
